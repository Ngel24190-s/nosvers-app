openapi: 3.0.3
info:
  title: tablero v2 — infra status
  version: 0.2.0
paths:
  /infra/status:
    get:
      summary: Obtener badges de estado de infra (VPS, WP, Stripe, AEGIS, cron, freqtrade)
      description: |
        El backend hace polling/aggregation server-side y cachea durante 30s.
        El frontend re-pull cada ≤ 60s (FR-030).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at: { type: string, format: date-time }
                  badges:
                    type: array
                    items:
                      type: object
                      required: [id, status, last_check]
                      properties:
                        id:
                          type: string
                          enum: [vps, wp, stripe, aegis, cron, freqtrade]
                        status:
                          type: string
                          enum: [ok, warn, error]
                        value: { description: "string | number", oneOf: [{type: string}, {type: number}] }
                        detail: { type: string }
                        link: { type: string, format: uri }
                        last_check: { type: string, format: date-time }
                        crones:
                          description: "Solo cuando id=cron"
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              last_run: { type: string, format: date-time }
                              expected_interval_s: { type: integer }
                              status: { type: string, enum: [ok, warn, error] }
        "401": { description: No autenticado }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
