# Configuración del cliente nosvers-voz para PC casa Angel.
# Copiar a ~/.config/nosvers-voz/config.toml y completar.

# === Conexión MCP ===
mcp_url = "https://nosvers-mcp.72.61.160.108.nip.io"
mcp_token = ""   # JWT Bearer emitido con issue_token.py en el VPS

# === Voz ===
idioma_default = "es"          # "es" | "fr"
velocidad_tts = 1.0            # 0.5–2.0
voz_es = "ef_dora"
voz_fr = "ff_siwis"

# === Wake word ===
umbral_wake = 0.6              # confianza mínima de openWakeWord
cooldown_wake_s = 3.0          # silencio tras activación
modelo_wake_path = "~/nosvers-voz-linux/models/claudio.onnx"

# === Sesión ===
auto_cierre_sin_habla_s = 8.0
timeout_total_sesion_s = 300.0

# === STT ===
modelo_stt = "small"           # tiny | base | small | medium
device_stt = "auto"            # auto | cpu | cuda

# === Claude (conversación) ===
# La clave ANTHROPIC_API_KEY se lee de env var, no de este archivo.
modelo_chat = "claude-sonnet-4-6"
max_tokens_chat = 600

# === Audio ===
input_device = ""              # vacío = default del sistema; usar `python3 -m sounddevice` para listar
input_samplerate = 16000
