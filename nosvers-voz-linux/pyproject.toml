[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nosvers-voz"
version = "1.0.0"
description = "Asistente de voz personal NosVers — cliente Linux casa (wake word Claudio + STT/TTS local)"
authors = [{name = "Angel"}, {name = "Claude Code (Director Ejecutivo NosVers)"}]
requires-python = ">=3.10"
license = {text = "private"}
dependencies = [
  "openwakeword>=0.6.0",
  "sounddevice>=0.4.6",
  "soundfile>=0.12.1",
  "numpy>=1.26",
  "faster-whisper>=1.0.0",
  "kokoro-onnx>=0.4.0",
  "httpx>=0.27",
  "anthropic>=0.40",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[project.scripts]
nosvers-voz = "nosvers_voz.__main__:main"

[tool.setuptools.packages.find]
include = ["nosvers_voz*"]
exclude = ["training*", "models*", "systemd*"]
